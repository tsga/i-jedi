cost function:
  cost type: 3D-Var
  jb evaluation: false
  time window:
    begin: 2020-12-14T21:00:00Z
    length: PT6H
  geometry: &geom
    geometry_type: fv3
    fms initialization:
      namelist filename: data/fv3/input_c12.nml
      field table filename: data/fv3/field_table
    npx: 13
    npy: 13
    npz: 127
    ntiles: 6
    akbk: gfs_127
  analysis variables:
  - air_temperature
  background:
    date: 2020-12-15T00:00:00Z
    state variables:
    - air_temperature
    io:
      filetype: fv3 history
      datapath: data_generated/fv3/
      atm_file: atmf006.nc
      sfc_file: sfcf006.nc
      field io names:
        air_temperature: tmp

  background error:
    covariance model: SABER
    saber central block:
      saber block name: spectral analytical filter
      function:
        horizontal daley length: 2000e3  # (in m)
      normalize filter variance: true
    saber outer blocks:
    - saber block name: spectral to gauss

  observations:
    observers:
    - obs space:
        name: Aircraft
        obsdatain:
          engine:
            type: H5File
            obsfile: data_generated/obs/aircraft.nc
        simulated variables:
        - airTemperature
      obs operator:
        name: Identity
        observation alias file: data/obs/obsop_name_map.yml

variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - geometry:
      geometry_type: atlas
      nlevels: 127
      function space: StructuredColumns
      grid:
        type: regular_gaussian
        N: 12
      partitioner: ectrans
      halo: 1
    ninner: 5
    gradient norm reduction: 1e-8
    test: on

output:
  analysis:
    io:
      filetype: unstructured
      filepath: 3dvar-fv3-inc-gauss-an
  increment:
    io:
      filetype: unstructured
      filepath: 3dvar-fv3-inc-gauss-inc-nativegauss

