cost function:
  cost type: 3D-Var
  jb evaluation: false
  time window:
    begin: 2020-12-13T00:00:00Z
    length: P6D
  geometry: &geom
    geometry_type: mom6
    ocean_hgrid: data_generated/mom6/ocean_hgrid.nc
    ocean_topog: data_generated/mom6/ocean_topog.nc
    vertical geometry from: data_generated/mom6/MOM.res.nc
    coarsen factor: 1
    has northern fold: true
    MOM_input:
      NIGLOBAL: 72
      NJGLOBAL: 35
      NZ: 25
      LAYOUT: [2, 1]
      MINIMUM_DEPTH: 0.5
  analysis variables:
  - sea_water_potential_temperature
  - sea_water_salinity
  - sea_surface_height_above_geoid
  background:
    date: 2020-12-16T00:00:00Z
    state variables:
    - sea_water_salinity
    - sea_water_potential_temperature
    - sea_surface_height_above_geoid
    - sea_water_depth
    io:
      filetype: mom6
      datapath: data_generated/mom6
      ocn_file: MOM.res.nc
      fix_file: mom6_structuredgeometry_cache_grid.nc
      field io names:
        sea_water_potential_temperature: Temp
        sea_water_salinity: Salt
        sea_surface_height_above_geoid: ave_ssh
        sea_water_depth: sea_water_depth

  background error:
    covariance model: SABER
    saber central block:
      saber block name: diffusion
      read:
        groups:
        - variables:
          - sea_water_potential_temperature
          - sea_surface_height_above_geoid
          - sea_surface_height_above_geoid
          multivariate strategy: univariate
          horizontal:
            filepath: diffusion_hz_mom6
          vertical:
            levels: 25
            filepath: diffusion_vt_mom6

  observations:
    observers:
    - obs space:
        name: SST
        obsdatain:
          engine:
            type: H5File
            obsfile: data_generated/obs/sst.nc
        simulated variables: [seaSurfaceTemperature]
      obs operator:
        name: Identity
        observation alias file: data/obs/obsop_name_map.yml
    # TODO: re-enable the insitu temperature obs space once the vader insitu
    # (GSW ocean) recipe PR is merged. Until then the required vader variable
    # change is unavailable, so it is disabled.
    # - obs space:
    #     name: InsituTemperature
    #     obsdatain:
    #       engine:
    #         type: H5File
    #         obsfile: data_generated/obs/insitu_temp_profile_argo_3prof.nc
    #     simulated variables: [waterTemperature]
    #   obs operator:
    #     name: VertInterp
    #     observation alias file: ./data/obs/obsop_name_map.yml
    #     vertical coordinate: sea_water_depth
    #     observation vertical coordinate: depth
    #     interpolation method: linear
    #     covariance model: diagonal
    - obs space:
        name: InsituSalinity
        obsdatain:
          engine:
            type: H5File
            obsfile: data_generated/obs/insitu_salt_profile_argo_3prof.nc
        simulated variables: [salinity]
      obs operator:
        name: VertInterp
        observation alias file: ./data/obs/obsop_name_map.yml
        vertical coordinate: sea_water_depth
        observation vertical coordinate: depth
        interpolation method: linear
        covariance model: diagonal

variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - geometry: *geom
    ninner: 3
    gradient norm reduction: 1e-8
    test: on

output:
  analysis:
    io:
      filetype: unstructured
      filepath: mom6-3dvar-an-unstructured

test:
  reference filename: testref/3dvar-mom6.test
  test output filename: 3dvar-mom6.test
